<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Cleanup Report</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1d2329; --muted:#66707a; --line:#e3e6ea;
  --green:#1f9d55; --green-bg:#e8f6ee; --yellow:#b7791f; --yellow-bg:#fdf5e6;
  --red:#c53030; --red-bg:#fdecec; --gray:#8a939c; --gray-bg:#f0f2f4; --accent:#2b6cb0;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15181c; --card:#1e2227; --ink:#e6e9ec; --muted:#9aa3ad; --line:#2e343b;
    --green-bg:#173325; --yellow-bg:#3a2e15; --red-bg:#3b1c1c; --gray-bg:#262b31; --accent:#63a4e8; }
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:24px 20px 120px}
h1{font-size:24px;margin:0 0 4px}
h2{font-size:17px;margin:0;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:16px}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stat .num{font-size:26px;font-weight:700}
.stat .lbl{color:var(--muted);font-size:13px}
.bar{height:10px;background:var(--gray-bg);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar>div{height:100%;border-radius:6px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.p-green{background:var(--green-bg);color:var(--green)} .p-yellow{background:var(--yellow-bg);color:var(--yellow)}
.p-red{background:var(--red-bg);color:var(--red)} .p-gray{background:var(--gray-bg);color:var(--gray)}
.sec-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.sec-head .tot{color:var(--muted);font-weight:600}
.items{margin-top:12px}
.item{display:grid;grid-template-columns:28px 34px 1fr auto;gap:8px;align-items:start;padding:10px 4px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .no{color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.item .name{font-weight:600}
.item .note{color:var(--muted);font-size:13px}
.item .path{font-family:Consolas,monospace;font-size:12px;color:var(--muted);word-break:break-all}
.item .size{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.info{grid-template-columns:28px 1fr auto}
input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);cursor:pointer}
select{font:inherit;font-size:12px;padding:1px 4px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-top:4px}
.collapsed .items,.collapsed .sec-tools{display:none}
.sec-tools{margin-top:8px;display:flex;gap:8px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button.link{border:none;background:none;color:var(--accent);padding:0}
.fbars .row{display:grid;grid-template-columns:minmax(120px,240px) 1fr 80px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.fbars .row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbars .row .b{height:14px;background:var(--accent);border-radius:4px;opacity:.75}
.fbars .row .v{text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;border-top:none}
td.r,th.r{text-align:right}
.sec-list .s{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sec-list .s:first-child{border-top:none}
.ico{width:22px;flex:none;text-align:center;font-size:16px}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.dock .in{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dock .sel{font-weight:700;font-size:15px}
.dock .hint{color:var(--muted);font-size:12px;flex:1;min-width:200px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.92}
.empty{color:var(--muted);padding:8px 4px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.langsw button{padding:3px 10px;font-size:12px}
.langsw button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>

</head>
<body>
<div class="wrap">
  <div class="top"><div><h1 id="title"></h1><div class="sub" id="meta"></div></div>
    <div class="langsw"><button data-lang="zh">中文</button> <button data-lang="en">English</button></div></div>
  <div class="card"><div class="grid g3" id="drives"></div></div>
  <div class="grid g3" id="summary" style="margin-top:16px"></div>
  <div class="card" id="sec-green"></div>
  <div class="card" id="sec-yellow"></div>
  <div class="card collapsed" id="sec-info"></div>
  <div class="card"><h2 id="fTitle"></h2><div class="sub" id="fSub"></div><div class="fbars" id="folders" style="margin-top:10px"></div></div>

</div>

  <div class="sel" id="selInfo"></div>
  <div class="hint" id="dockHint"></div>
  <button id="btnDl"></button>
  <button class="primary" id="btnCopy"></button>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = mb => mb >= 1024 ? (mb/1024).toFixed(1) + ' GB' : Math.round(mb) + ' MB';
const low = s => String(s || '').toLowerCase();
const under = (p, root) => { p = low(p); root = low(root).replace(/\\+$/, ''); return p === root || p.startsWith(root + '\\'); };
const base = p => String(p).split('\\').pop();
const $ = id => document.getElementById(id);

const otherDrive = drives.filter(d => d.drive.toUpperCase() !== 'C:').sort((a, b) => b.freeGB - a.freeGB)[0];
let green, yellow, info, all;

    const [nm, note] = label(c);
    if (/Recycle Bin/i.test(c.name)) { info.push({ name: t('recycle', (c.name.match(/\((.*)\)/)||[])[1]), note: t('recycleN'), size: c.sizeMB }); continue; }
    if (/Downloads folder|CurseForge Minecraft instances/i.test(c.name)) { info.push({ name: nm, note, size: c.sizeMB, path: c.path }); continue; }
    covered.push(c.path);
    if (/\\ProgramData\\Microsoft\\/i.test(c.path) || /SoftwareDistribution/i.test(c.path)) { info.push({ name: nm, note, size: c.sizeMB, path: c.path }); continue; }
    if (c.sizeMB < 1) continue;
    (c.risk === 'safe' ? green : yellow).push({ key: 'c:' + c.path, name: nm, note, size: c.sizeMB, path: c.path, approve: [c.risk === 'safe' ? c.path + '\\*' : c.path] });
  }
  // old-version folders: same file under ...\<x.y.z>\...
  const verRx = /^v?\d+(\.\d+){2,}$/, groups = {}, used = new Set();
  for (const f of largeFiles) {
    const s = f.path.split('\\'), i = s.findIndex(x => verRx.test(x));
    if (i < 0) continue;
    const k = low(s.slice(0, i).join('\\')) + '|' + low(s.slice(i + 1).join('\\'));
    (groups[k] = groups[k] || []).push({ f, ver: s[i], folder: s.slice(0, i + 1).join('\\'), parent: s.slice(0, i) });
  }
  const cmp = (a, b) => { const x = a.replace(/^v/,'').split('.').map(Number), y = b.replace(/^v/,'').split('.').map(Number);
    for (let k = 0; k < Math.max(x.length, y.length); k++) { const d = (x[k]||0) - (y[k]||0); if (d) return d; } return 0; };
  for (const g of Object.values(groups)) {
    if (g.length < 2) continue;
    g.sort((a, b) => cmp(b.ver, a.ver));
    const newest = g[0], old = g.slice(1);
    const app = newest.parent.filter(s => !/^(apps?|versions?|bin|program files.*|appdata|local|roaming|users|[a-z]:)$/i.test(s) && s !== R.user).pop() || t('program');
    g.forEach(x => used.add(x.f.path));
    yellow.push({ key: 'v:' + newest.parent.join('\\'), name: t('oldVer', app, old.length), note: t('oldVerN', newest.ver),
      size: old.reduce((s, x) => s + x.f.sizeMB, 0), path: newest.parent.join('\\'), atLeast: true, approve: old.map(x => x.folder) });
  }
  const mediaRx = /\.(mp4|mov|mkv|avi|wmv|flv|webm|m4v|wav|mp3|flac|zip|rar|7z|iso|img|psd|prproj)$/i, personal = [];
  for (const f of largeFiles) {
    if (used.has(f.path) || covered.some(r => under(f.path, r))) continue;
    const p = f.path, inApp = /\\AppData\\/i.test(p), it = { key: 'f:' + p, name: base(p), size: f.sizeMB, path: p, approve: [p] };
    if (f.ext === '.dmp') { green.push({ ...it, note: t('dmp') }); continue; }
    if (inApp && f.ext === '.exe' && /\\(download|downloads|update|updates|installer|packages)\\/i.test(p)) { green.push({ ...it, note: t('upd') }); continue; }
    if (/(Video Previews|Audio Previews|Media Cache)/i.test(p)) { yellow.push({ ...it, note: t('adobe') }); continue; }
    if (!inApp && mediaRx.test(p)) { personal.push({ ...it, note: t('lastOpen') + ': ' + (f.lastAccess || '?') + ' · ' + p.split('\\').slice(-2, -1)[0], movable: true }); continue; }
    info.push({ name: base(p), note: inApp ? t('appFile') : t('selfJudge'), size: f.sizeMB, path: p });
  }
  yellow.push(...personal);
  [green, yellow, info].forEach(l => l.sort((a, b) => b.size - a.size));
  let n = 0; [...green, ...yellow].forEach(it => it.no = ++n);
  all = [...green, ...yellow];
}

/* ================= security ================= */
function securityItems() {
  const s = R.security || {}, d = s.defender || {}, out = [];
  if (d.antivirusEnabled === false || d.realTimeProtection === false) out.push({ level: 'bad', t: t('defOff'), d: t('defOffD') });
  else out.push({ level: 'ok', t: t('defOn'), d: t('defOnD', d.signatureAgeDays) });
  if (d.signatureAgeDays > 7) out.push({ level: 'warn', t: t('sigOld'), d: t('sigOldD') });
  if (!d.lastFullScan) out.push({ level: 'warn', t: t('noFull'), d: t('noFullD') });
  const th = arr(s.recentThreats);
  out.push(th.length ? { level: 'bad', t: t('threats', th.length), d: t('threatsD') } : { level: 'ok', t: t('noThreats'), d: '' });
  arr(s.flaggedStartup).forEach(x => {
    const miss = arr(x.flags).includes('file-missing');
    out.push({ level: miss ? 'info' : 'warn', t: t('stItem', x.name), d: miss ? t('stMissingD') : t('stFlagD', arr(x.flags).join(', '), x.exe || x.command) });
  });
  const fi = s.fractureiserIndicators || {};
  if (arr(fi.files).length || arr(fi.startupEntries).length) out.push({ level: 'bad', t: t('frac'), d: t('fracD') });
  else if (s.minecraftModJarCount) out.push({ level: 'ok', t: t('mods', s.minecraftModJarCount), d: t('modsD') });
  const odd = arr(s.recentExecutablesInTempOrDownloads).filter(e => !/\.tmp\.js$|\\scoped_dir|\\jna-|\\jianyingpro_ext\\/i.test(e.path));
  if (odd.length) out.push({ level: 'info', t: t('exe', odd.length), d: odd.slice(0, 5).map(e => base(e.path)).join(', ') + (odd.length > 5 ? ' …' : '') + '. ' + t('exeD') });
  return out;
}

/* ================= render ================= */
function render() {
  const keep = new Map([...document.querySelectorAll('input[type=checkbox][data-key]:checked')].map(c => {
    const s = document.querySelector(`select.act[data-key="${CSS.escape(c.dataset.key)}"]`); return [c.dataset.key, s ? s.value : 'del']; }));
  classify();
  document.documentElement.lang = LANG === 'zh' ? 'zh-Hant' : 'en';
  document.title = t('title');
  document.querySelectorAll('.langsw button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  $('title').textContent = t('title');
  $('meta').textContent = `${R.computer || ''} · ${R.os || ''} · ${t('scanned')} ${String(R.generatedAt || '').replace('T', ' ')} (${R.elapsedSeconds || '?'} ${t('sec')})` + (R.isAdmin ? '' : ' · ' + t('nonAdmin'));

  $('drives').innerHTML = drives.map(d => {
    const col = d.freePct < 10 ? 'var(--red)' : d.freePct < 20 ? 'var(--yellow)' : 'var(--green)';
    const tag = d.freePct < 10 ? `<span class="pill p-red">${t('low')}</span>` : d.freePct < 20 ? `<span class="pill p-yellow">${t('little')}</span>` : `<span class="pill p-green">${t('ok')}</span>`;
    return `<div class="stat"><div style="display:flex;justify-content:space-between"><b>${esc(d.drive)} ${esc(d.label || '')}</b>${tag}</div>
      <div class="bar"><div style="width:${100 - d.freePct}%;background:${col}"></div></div>
      <div class="lbl">${t('free')} <b>${d.freeGB} GB</b> ${t('of')} ${d.totalGB} GB (${d.freePct}%)</div></div>`;
  }).join('');

  const sumG = green.reduce((s, x) => s + x.size, 0), sumY = yellow.reduce((s, x) => s + x.size, 0);
  const issues = securityItems().filter(x => x.level !== 'ok').length;
  $('summary').innerHTML = `
    <div class="card stat" style="margin:0"><div class="num" style="color:var(--green)">${fmt(sumG)}</div><div class="lbl">${t('safeSum')}</div></div>
    <div class="card stat" style="margin:0"><div class="num" style="color:var(--yellow)">${fmt(sumY)}</div><div class="lbl">${t('checkSum')}</div></div>
    <div class="card stat" style="margin:0"><div class="num" style="color:${issues ? 'var(--yellow)' : 'var(--green)'}">${issues ? t('alerts', issues) : t('noAlerts')}</div><div class="lbl">${t('secSum')}</div></div>`;

  const row = it => {
    const k = esc(it.key), chk = keep.has(it.key) ? 'checked' : '', act = keep.get(it.key);
    const mv = it.movable && otherDrive ? `<div><select data-key="${k}" class="act"><option value="del">${t('actDel')}</option><option value="move" ${act === 'move' ? 'selected' : ''}>${esc(t('actMove', otherDrive.drive, otherDrive.freeGB))}</option></select></div>` : '';
    return `<label class="item"><input type="checkbox" data-key="${k}" ${chk}><span class="no">${it.no}</span>
      <div><div class="name">${esc(it.name)}</div><div class="note">${esc(it.note)}</div>${it.path ? `<div class="path">${esc(it.path)}</div>` : ''}${mv}</div>
      <div class="size">${it.atLeast ? '≥ ' : ''}${fmt(it.size)}</div></label>`;
  };
  const section = (id, icon, title, pill, list, tools) => {
    const col = $(id).classList.contains('collapsed');
    $(id).innerHTML = `<div class="sec-head"><h2>${icon} ${title} <span class="pill ${pill}">${t('items', list.length)}</span></h2><span class="tot">${fmt(list.reduce((s, x) => s + x.size, 0))} ▾</span></div>
      ${tools ? `<div class="sec-tools">${tools}</div>` : ''}<div class="items">${list.length ? list.map(row).join('') : `<div class="empty">${t('none')}</div>`}</div>`;
    $(id).classList.toggle('collapsed', col);
    $(id).querySelector('.sec-head').onclick = () => $(id).classList.toggle('collapsed');
  };
  section('sec-green', '🟢', t('green'), 'p-green', green, `<button class="link" id="allGreen">${t('selectAll')}</button>`);
  section('sec-yellow', '🟡', t('yellow'), 'p-yellow', yellow, '');
  $('sec-info').innerHTML = `<div class="sec-head"><h2>⚪ ${t('info')} <span class="pill p-gray">${t('items', info.length)}</span></h2><span class="tot">${t('expand')} ▾</span></div>
    <div class="items">${info.map(it => `<div class="item info"><span class="no">–</span><div><div class="name">${esc(it.name)}</div><div class="note">${esc(it.note)}</div>${it.path ? `<div class="path">${esc(it.path)}</div>` : ''}</div><div class="size">${fmt(it.size || 0)}</div></div>`).join('')}</div>`;
  $('sec-info').querySelector('.sec-head').onclick = () => $('sec-info').classList.toggle('collapsed');
  $('allGreen').onclick = e => { e.preventDefault(); document.querySelectorAll('#sec-green input[type=checkbox]').forEach(c => c.checked = true); update(); };

  $('fTitle').textContent = t('fTitle'); $('fSub').textContent = t('fSub');
  const folders = arr(R.largeFolders).filter(f => f.sizeMB > 50).slice(0, 12), fmax = Math.max(1, ...folders.map(f => f.sizeMB));
  $('folders').innerHTML = folders.map(f => `<div class="row"><div class="lab" title="${esc(f.path)}">${esc(base(f.path))}</div><div><div class="b" style="width:${(100 * f.sizeMB / fmax).toFixed(1)}%"></div></div><div class="v">${fmt(f.sizeMB)}</div></div>`).join('') || `<div class="empty">${t('fNone')}</div>`;

  // programs
  const progs = arr(R.programs), defOn = (R.security || {}).defender && R.security.defender.antivirusEnabled;
  const FAM = [[/^Java/i, 'Java'], [/^Python 3/i, 'Python'], [/Visual Studio Code/i, 'VS Code'], [/^Node\.js/i, 'Node.js']], fc = {};
  progs.forEach(p => { const f = FAM.find(([rx]) => rx.test(p.name)); p.fam = f ? f[1] : null; if (f) fc[f[1]] = (fc[f[1]] || 0) + 1; });
  progs.forEach(p => {
    const fl = [];
    p.keep = /Visual C\+\+|Redistributable|\.NET|DirectX|NVIDIA|Update Health|Compatibility/i.test(p.name) || /^Microsoft (Edge|365|OneNote|OneDrive)|^Copilot$|^Microsoft GameInput|^Xbox/i.test(p.name);
    if (p.fam && fc[p.fam] > 1) fl.push(t('dupFam', fc[p.fam], p.fam));
    if (defOn && /McAfee|Norton|Avast|AVG|Avira|Kaspersky|Trend Micro|ESET/i.test(p.name)) fl.push(t('avDup'));
    if (!p.keep && (p.sizeMB || 0) >= 2000) fl.push(t('big'));
    p.flags = fl;
  });
  const flagged = progs.filter(p => p.flags.length).sort((a, b) => (b.sizeMB || 0) - (a.sizeMB || 0));
  const pr = p => `<tr><td><b>${esc(p.name)}</b><div class="sub">${esc(p.publisher || '')}${p.installDate ? ' · ' + t('installed') + ' ' + esc(p.installDate) : ''}</div></td><td class="r">${p.sizeMB ? fmt(p.sizeMB) : '—'}</td><td>${p.flags.length ? p.flags.map(esc).join('<br>') : (p.keep ? `<span class="sub">${t('keepSys')}</span>` : '')}</td></tr>`;
  $('programs').innerHTML = `<div class="sec-head"><h2>${t('progTitle')} <span class="pill p-gray">${t('progCount', progs.length)}</span></h2></div>
    <div class="sub" style="margin-top:4px">${t('progHow')}</div>
    <table><thead><tr><th>${t('thProg')}</th><th class="r">${t('thSize')}</th><th>${t('thAdvice')}</th></tr></thead><tbody id="progBody">${flagged.map(pr).join('') || `<tr><td colspan="3" class="sub">${t('progNone')}</td></tr>`}</tbody></table>
    <div style="margin-top:8px"><button class="link" id="progAll">${t('progAll', progs.length)}</button></div>`;
  $('progAll').onclick = () => { $('progBody').innerHTML = progs.slice().sort((a, b) => (b.sizeMB || 0) - (a.sizeMB || 0)).map(pr).join(''); $('progAll').remove(); };

  // startup
  const miss = !('startup' in R), st = miss ? arr((R.security || {}).flaggedStartup) : arr(R.startup);
  const KEEP = /SecurityHealth|Windows Defender|RtkAudio|Realtek|NVIDIA|Intel|AMD|igfx|OneDrive|Synaptics|ELAN/i;
  const sr = x => { const f = arr(x.flags);
    const tip = f.includes('file-missing') ? `<span class="pill p-gray">${t('stLeft')}</span>` : f.length ? `<span class="pill p-yellow">${t('stLook')}</span>`
      : KEEP.test(x.name + ' ' + x.command) ? `<span class="pill p-green">${t('stKeep')}</span>` : x.source === 'ScheduledTask' ? `<span class="pill p-gray">${t('stTask')}</span>` : `<span class="pill p-gray">${t('stOpt')}</span>`;
    return `<tr><td><b>${esc(x.name)}</b><div class="path">${esc(x.command)}</div></td><td>${esc(x.signer || (x.signature === 'Valid' ? t('signed') : t('unknown')))}</td><td>${tip}</td></tr>`; };
  $('startup').innerHTML = `<h2>${t('stTitle')} <span class="pill p-gray">${t('items', st.length)}</span></h2>
    ${miss ? `<div class="sub" style="color:var(--yellow)">${t('stOld')}</div>` : ''}<div class="sub">${t('stHow')}</div>
    <table><thead><tr><th>${t('thItem')}</th><th>${t('thPub')}</th><th>${t('thAdvice')}</th></tr></thead><tbody>${st.map(sr).join('') || `<tr><td colspan="3" class="sub">${t('stNone')}</td></tr>`}</tbody></table>`;

  const ICON = { ok: '✅', warn: '⚠️', bad: '⛔', info: 'ℹ️' };
  $('security').innerHTML = `<h2>${t('secTitle')}</h2><div class="sub">${t('secSub')}</div>
    <div class="sec-list" style="margin-top:8px">${securityItems().map(x => `<div class="s"><div class="ico">${ICON[x.level]}</div><div><b>${esc(x.t)}</b><div class="sub">${esc(x.d)}</div></div></div>`).join('')}</div>`;

  $('dockHint').textContent = t('dockHint'); $('btnDl').textContent = t('btnDl'); $('btnCopy').textContent = t('btnCopy');
  update();
}

/* ================= selection ================= */
function selected() {
  return [...document.querySelectorAll('input[type=checkbox][data-key]:checked')].map(c => {
    const it = all.find(x => x.key === c.dataset.key), s = document.querySelector(`select.act[data-key="${CSS.escape(it.key)}"]`);
    return { ...it, action: s ? s.value : 'del' };
  });
}
function update() { const s = selected(); $('selInfo').textContent = s.length ? t('sel', s.length, fmt(s.reduce((a, x) => a + x.size, 0))) : t('selNone'); }
document.addEventListener('change', e => { if (e.target.matches('input[type=checkbox], select.act')) update(); });
document.querySelectorAll('.langsw button').forEach(b => b.onclick = () => { LANG = b.dataset.lang; render(); });

function approvedText(s) {
  const lines = ['# ' + t('cGen') + ' ' + new Date().toLocaleString()];
  s.filter(x => x.action === 'del').forEach(x => { lines.push('# ' + x.no + ' ' + x.name); x.approve.forEach(a => lines.push(a)); });
  return lines.join('\r\n') + '\r\n';
}
function claudeText(s) {
  const del = s.filter(x => x.action === 'del'), mv = s.filter(x => x.action === 'move');
  let txt = t('cIntro', s.length, fmt(s.reduce((a, x) => a + x.size, 0))) + '\n';
  if (del.length) txt += `\n${t('cDel')} ${del.map(x => x.no).join(', ')}\n` + del.map(x => `${x.no}. ${x.name} (${fmt(x.size)})`).join('\n') + `\n\n${t('cList')}\n` + approvedText(del);
  if (mv.length) txt += `\n${t('cMove', otherDrive.drive)}\n` + mv.map(x => `${x.no}. ${x.path}`).join('\n') + '\n';
  return txt;
}
function toast(m) { const el = $('toast'); el.textContent = m; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 2200); }
$('btnCopy').onclick = async () => {
  const s = selected(); if (!s.length) return toast(t('pickFirst'));
  const txt = claudeText(s);
  try { await navigator.clipboard.writeText(txt); }
  catch { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(t('copied'));
};
$('btnDl').onclick = () => {
  const s = selected().filter(x => x.action === 'del'); if (!s.length) return toast(t('pickDel'));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + approvedText(s)], { type: 'text/plain' }));
  a.download = 'approved.txt'; a.click(); toast(t('downloaded'));
};
render();
</script>
</body>
